# Issue #144 -- requirements.txt was the whole of what this project said
# about how to install it, and it is the one packaging format that cannot
# express a Python floor or an optional group.
#
# Python 3.11 is a hard requirement, not a preference: mcp_client/client.py
# uses asyncio.timeout (3.11+), and 27 sites use runtime `X | Y` annotations
# (3.10+). On 3.10 a user got `AttributeError: module 'asyncio' has no
# attribute 'timeout'` from inside the MCP connect path, AFTER
# `pip install -r requirements.txt` reported success. requires-python turns
# that into a refusal at install time.

# setuptools>=77 is the floor for PEP 639: the SPDX `license = "Apache-2.0"` string below is
# read as a classifier expression only from that release on. An older backend treats it as a
# path and fails the build rather than warning, so this floor and that line move together.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "venastine-research-harness"
version = "0.2.0b1+pillow.floor.r86271a0fb0cd"
description = "A from-scratch agentic harness: tool-using chat plus a ten-pass self-critiquing research pipeline."
readme = "README.md"
requires-python = ">=3.11"
# PEP 639: a bare SPDX expression, not the deprecated `{ text = ... }` table, and no
# `License :: OSI Approved ::` classifier -- PEP 639 supersedes those and setuptools warns on
# both. `license-files` is declared rather than left to the backend's default glob so the file
# that ships is the one named here.
license = "Apache-2.0"
# NOTICE ships WITH the licence, not beside it in the repo only: a NOTICE that
# is not listed here exists in a checkout and is absent from every sdist and
# wheel, which defeats the reason for having one. Apache-2.0 4(d) is what makes
# the pairing meaningful downstream.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yahya Hammad" }]
maintainers = [{ name = "Yahya Hammad" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ONE dependency list, and it stays in requirements.txt -- the file that
# already carries the D22 rationale comments explaining why `textual` and
# `mcp` are upper-bounded. Inlining the list here would create a second
# hand-maintained copy of the same fact, which is the shape #144 was filed
# about in the first place ("a hand-maintained list is only as complete as
# the file it lives in"). setuptools strips comments and blank lines.
#
# THIS KEY MUST STAY INSIDE [project], above the sub-tables. TOML scopes a
# bare key to the most recent table header, so when this sat below
# [project.urls] it parsed as `project.urls.dynamic` and setuptools refused
# the whole file: "`project.urls.dynamic` must be string". `pip install -e .`
# failed outright, which also meant requires-python -- the entire point of
# #144 -- was never enforced, because the install never got far enough to
# check it. Moving a key past a table header here is not cosmetic.
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/YahyaHammad/Venastine-Research-Harness"
Repository = "https://github.com/YahyaHammad/Venastine-Research-Harness"
Issues = "https://github.com/YahyaHammad/Venastine-Research-Harness/issues"

[project.optional-dependencies]
# markitdown's only consumer is tools/builtin/file_ops.py, which implements
# read/write/edit -- all three globally denied, and per S24 they cannot be
# re-enabled at runtime at all (is_tool_allowed reads config.ToolPermissions
# directly, settings.json has no permissions section, and D14 forbids a
# ToolContext widening anything). The import is lazy, so a default install
# never reaches it. It brought 11 transitive distributions, 5 of them for
# markitdown alone.
#
# protobuf moves with it rather than staying in the default set: nothing in
# the repo imports it, and the only installed distribution requiring it is
# onnxruntime, which arrives through markitdown. Left behind it would pin a
# transitive dependency of a package no longer installed by default.
documents = ["markitdown==0.1.9", "protobuf==7.36.2"]

# Optional in the code too, and documented as such at
# core/reasoning/output_writer.py:185 -- the PDF path is guarded by
# `except ImportError: return`. Declared here so the group has a name;
# neither was ever in requirements.txt.
pdf = ["markdown", "weasyprint"]

# S18-07, batch 136. These four were at the bottom of requirements.txt, and
# `dynamic = ["dependencies"]` above reads that file, so they were hard
# requirements of the DISTRIBUTION: `pip install venastine-research-harness`
# resolved a test runner and its scheduler, and bin/venastine.mjs installed
# the same set into every end user's venv.
#
# NAMED HERE RATHER THAN READ FROM THE FILE, because setuptools'
# `optional-dependencies` is all-or-nothing: making this one group dynamic
# would force `documents` and `pdf` into files of their own, which is churn
# to two groups that work in order to avoid typing four names. The names are
# therefore in two places, and `test_the_test_extra_matches_requirements_test`
# is what stops them drifting -- #144's rule is that a hand-maintained
# duplicate is only as good as the gate over it.
#
# Floors, not pins, matching requirements-test.txt: D22's argument for
# pinning is about packages whose behaviour CI's RESULT depends on.
test = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=1.0",
    "pytest-xdist>=3.6",
    "starlette>=0.40",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
# Lint gate (lint.yml), judged against the 3.11 floor even though
# developers may run 3.12/3.13 locally -- UP modernisations must be valid
# where CI runs, not just where they were written.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
  # Long docstring/comment lines are the record (decision ids, trace
  # excerpts, URLs). Reflowing them for a ruler would bury the content.
  "E501",
  # `Optional[X]` is this codebase's idiom (300+ sites); `X | None`
  # rewrites are churn with zero behaviour change.
  "UP045",
  # Deferred imports are architectural: tools/registry.py <-> agents/
  # subagent_tool.py would cycle at import time, and several tests import
  # only after arranging fixtures/patches.
  "E402",
  # printf-style `%` is the logging convention (AGENTS.md: interpolate via
  # logger args, never f-strings at the call site) and the user-facing
  # string idiom; mass conversion is churn for no behaviour change.
  "UP031",
]

[tool.setuptools]
# DECLARATIVE ONLY -- this project is run from a checkout, not installed.
# `pip install .` would otherwise put `config`, `main`, `storage` and
# `conftest` into site-packages as top-level names, where they collide with
# anything. Empty lists mean `pip install -e .` resolves the dependencies
# and enforces the Python floor without installing a single module, which
# is exactly what is wanted here. README's `pip install -r requirements.txt`
# remains the documented install path.
packages = []
py-modules = []
