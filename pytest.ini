[pytest]
testpaths = tests
# -m "not integration" keeps the DEFAULT run offline: no socket, and no
# process except the three named below. The FOUR integration tests each need
# a real process and none can be shown in-process: three spawn a stdio MCP
# server to prove §17 AC8 (no orphaned children, and that one hung handshake
# strands neither its own child nor anybody else's), and one runs an external
# program through the host fallback shell to prove the shell is WAITED for
# (batch 130, S02-01 -- it was not, and every fallback test that patches
# `subprocess.run` is blind to that by construction).
# Run them deliberately:  pytest -m integration
#
# THE EXCEPTION TO "NO PROCESS", NAMED RATHER THAN GLOSSED (batch 151,
# S19-13). `tests/test_wsl_backend.py` has three `needs_wsl` tests that drive
# a REAL distribution, because SS45's reparse point and the two-tokeniser
# corpus cannot be faked without asserting the assumption instead of the
# fact. They are skipped wherever there is no WSL, so CI and every POSIX box
# spawn nothing -- which is why this sentence said "no process" for fifty
# batches and nobody noticed it was false on the primary platform.
#
# The PROBE that decides that skip was the larger half and is fixed: it was
# `pytest.mark.skipif(not _has_wsl(), ...)`, evaluated at IMPORT, so every
# xdist worker ran it during collection -- 11 live `wsl.exe` calls on this
# box before a single test body, each bounded at 20s. It is a cached string
# condition now, which pytest evaluates at SETUP, so a default run asks at
# most once per process and only in the process that runs those three.
#
# -n auto is 70% of the cores, not all of them -- the rule lives in the ROOT
# conftest.py's `pytest_xdist_auto_num_workers`, with the reasoning. Serial
# is `pytest -n0`, and every core is `pytest -n logical`, which is NOT
# FASTER -- measured under both distribution modes, batch 109 and again
# in batch 110. CI takes this same default, so a contributor and the
# runner execute the same command.
#
# --dist LOADSCOPE, AND NOT THE DEFAULT `load`. This is a coverage decision,
# not a performance one, and the next reader's instinct will be that `load`
# balances better -- it does. But `load` hands out INDIVIDUAL tests, and
# three places in this suite depend on one test running immediately after
# another IN THE SAME PROCESS:
#
#   * tests/test_probe_isolation.py::TestWhatOneTestLeavesForTheNext --
#     two ordered pairs, and its docstring says so
#   * tests/test_config_edit.py::TestTheLoaderCacheDoesNotLeakBetweenTests
#   * tests/test_storage_e2e.py -- its module-scoped fixtures, plus tests
#     that read the database earlier ones wrote
#
# Split across workers, NONE OF THEM FAILS. They go silently vacuous,
# because the autouse fixtures in tests/conftest.py reinstall the clean
# state for every test anyway -- so "and the next one does not inherit it"
# passes whoever ran before it. A green suite that has stopped checking the
# thing it exists to check is worse than a slow one.
#
# loadscope keeps all three, STRUCTURALLY rather than by luck: it groups by
# CLASS for a test inside one and by MODULE for a test that is not, so both
# ordered pairs (one class each) and the e2e module (plain functions) stay
# on one worker in collection order. Batch 109 shipped `loadfile` only
# because loadscope was RED -- on a leak in test_storage_e2e.py that had
# nothing to do with xdist, which batch 110 found and fixed. Measured after
# the fix, alternated so drift cancels: 3:03 loadfile against 2:12
# loadscope, three runs each, identical results.
#
# TWO THINGS IT COSTS, both stated because they are what made this an owner
# decision rather than a tuning change:
#
#   * A FUTURE coupling between two CLASSES in one file goes vacuous where
#     loadfile would have kept it. An ordered pair belongs inside ONE
#     class, which is where all three above already are. Batch 114 raised
#     that cost deliberately: tests/test_tui.py is one class per section
#     banner and so one GROUP per banner, where its 183 classless tests had
#     been a single group and the floor the whole suite waited on
#     (TECHNICAL_DEBT 30). None of them was an ordered pair, and that was
#     established by running every class standing alone rather than by
#     reading the file.
#
#     NO COUNT HERE ON PURPOSE (batch 151, S19-02). This said "62 classes
#     and so 62 groups" and the file is 71 -- the argument needs "the
#     classless group is gone", never the integer, and the one copy of that
#     integer worth keeping is AGENTS.md's, which
#     `test_agents_md_states_the_real_test_tui_class_count` reads back out
#     of the sentence and compares against `ast`.
#   * A file is no longer one group, so a non-function-scoped fixture in a
#     file that also has classes is set up TWICE on a worker that takes
#     both, and `real_storage` cannot survive a second setup;
#     `test_storage_e2e.py` therefore declares no test class, pinned by
#     `test_this_file_declares_no_test_class`. The RULE is what matters and
#     it is general -- a module- or session-scoped fixture's file holds no
#     test class -- so no count is stated here: this said "the suite's only
#     such fixture" and there have been two in that file since batch 110
#     (batch 151, S19-01). The rule is pinned for every file, and not just
#     for the one that has the fixtures today, by
#     `test_every_file_with_a_module_scoped_fixture_declares_no_test_class`.
addopts = -ra --strict-markers -m "not integration" -n auto --dist loadscope
markers =
    integration: spawns real subprocesses; excluded from the default run
