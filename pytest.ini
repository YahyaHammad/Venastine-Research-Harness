[pytest]
testpaths = tests
# -m "not integration" keeps the DEFAULT run strictly offline: no process,
# no socket. The one integration test spawns a real stdio MCP server to
# prove §17 AC8 (no orphaned children), which cannot be shown in-process.
# Run it deliberately:  pytest -m integration
addopts = -ra --strict-markers -m "not integration"
markers =
    integration: spawns real subprocesses; excluded from the default run
