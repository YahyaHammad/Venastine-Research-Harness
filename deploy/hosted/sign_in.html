<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>$title</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: #0c181f; color: #e6edf1;
      font-family: "Roboto Mono", Menlo, Consolas, monospace;
    }
    main { max-width: 640px; padding: 32px 20px; line-height: 1.55; }
    .handle {
      margin: 24px 0; padding: 14px 16px; border: 1px solid #2f4a59;
      border-radius: 6px; background: #12232c; font-size: 1.15rem;
      overflow-wrap: anywhere; user-select: all;
    }
    .handle:empty { display: none; }
    footer { margin-top: 24px; color: #6f8794; font-size: 0.85rem; }
  </style>
</head>
<body>
<main>
  <h1>$title</h1>
  <p>$text</p>
  <p class="handle">$handle</p>
  <footer>ModelScope sign-in &middot; $build</footer>
</main>
</body>
</html>
