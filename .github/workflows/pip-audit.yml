# Supply-chain audit: this project's dependency files against the OSV
# database.
#
# Schedule, not per-PR: vulnerabilities arrive over time, not with pushes,
# and this is the one job in the set that needs network (OSV lookup).
# Running it per push would tax every PR for information that changes
# weekly. `workflow_dispatch` covers the "new advisory just dropped" case.
#
# `-r <file>`, never bare `pip-audit`: the files ARE the dependency
# lists, while a bare run audits whatever happens to sit in site-packages
# -- including the scanner's own transitive deps, which this project
# cannot fix.
#
# TWO FILES SINCE BATCH 141 (S18-04), and the sentence above used to say
# "the file is the ONE dependency list". That stopped being true in batch
# 136, which moved the suite's packages into requirements-test.txt and
# declared them as pyproject's `test` extra -- so this job was auditing 18
# of the 22 declared distributions and nothing audited the other four. A
# test runner is still software a contributor installs on the strength of
# this file.
#
# NEVER RUN UNTIL THE MERGE, which is the other half of S18-04 and is not
# a thing this file can fix: `schedule` and `workflow_dispatch` both
# resolve against the DEFAULT branch, and until this branch lands the
# workflow does not exist there. `gh run list --workflow pip-audit.yml`
# answered `HTTP 404: workflow not found on the default branch`, so the
# five pins this branch added -- two of which ship compiled native code,
# and one of which requirements.txt calls the dependency "this project's
# SECURITY rests on" -- had been through no audit at all. Run by hand at
# batch 141 against both files: no known vulnerabilities in either.
#
# The `pull_request` trigger below is what stops that recurring. It is
# filtered to the two dependency files, which answers the header's own
# objection that "running it per push would tax every PR": a dependency
# change is the one push where the cost is the point.
#
# Threshold note: pip-audit 2.x has no severity filter, only per-ID
# `--ignore-vuln`. The tree is clean at ALL levels as of rollout
# (verified locally), so fail-on-any is the posture: a future LOW is
# triaged to an inline `--ignore-vuln <ID>  # reason` in this file, not
# waved through silently. That is stricter than HIGH+-only, in the safe
# direction, and revisitable the day it bites.

name: pip-audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - requirements.txt
      - requirements-test.txt

permissions:
  contents: read

concurrency:
  group: pip-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          # BOTH files, or the cache key does not move when the test
          # packages do (batch 141).
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit==2.10.1"

      - name: Audit requirements.txt
        run: pip-audit -r requirements.txt --desc

      - name: Audit requirements-test.txt
        run: pip-audit -r requirements-test.txt --desc
