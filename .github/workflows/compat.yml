# Compatibility matrix, lean by design: the full suite stays on 3.11/Ubuntu
# in tests.yml, and these two jobs cover what that gate cannot see.
#
# py313-info: pyproject advertises 3.11-3.13, but CI only ran 3.11 -- so a
# 3.12-only syntax slip (PEP 701 f-string tokens, the exact construct
# tools/_math_common.py reasons about) or a version-gated stdlib change
# lands green and breaks a user. Informational (`continue-on-error`)
# until sustained green; promoting it to required is one flag flip once
# the failures it finds are fixed rather than recorded.
#
# windows-subset: development happens on win32, CI runs Ubuntu. The
# Windows-only defects this project has actually had -- UNC `realpath`
# raising inside `_within` (Q3), `list2cmdline` quoting, NUL-path and
# symlink behaviour, POSIX toolchains resolved off PATH (EP8) -- all live
# in test_shell.py and test_posture.py. Running those two files on
# windows-latest covers the platform split for ~2 min instead of a second
# 15-minute suite. Same fresh-clone steps (providers.json is needed even
# here), same `python -m pytest` rule. Since batch 226 it also runs the
# `integration` tests, whose Windows half nothing else runs.
#
# Every job here takes pytest.ini's parallel default. For windows-subset
# that is nearly a no-op and the arithmetic says why: it names two files,
# and `--dist loadscope` splits a file only at its CLASS boundaries, so
# the ceiling is however many classes those two files have between them
# rather than the core count. (Before batch 110 the mode was loadfile and
# the ceiling was two workers flat.)

name: compat

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ROADMAP_v3 §94 (PL32): a change whose every file is under plugins/
  # runs none of this workflow's other jobs -- they show as skipped, which
  # GitHub counts as passing -- and plugins.yml tests it instead. A job
  # that decides, never a path filter on the trigger: deploy_gate.py
  # refuses one, since a push could then leave this workflow unrun and the
  # demo's gate would wait for it forever. Standard library and git only.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.changes.outputs.core }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # A pull request's merge commit and its base, or a push's tip.
          fetch-depth: 2
          persist-credentials: false

      - name: Which side the change touches
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 scripts/plugin_ci.py changes

  py313-info:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      # uv, for the reason tests.yml's docs-consistency job gives
      # (ROADMAP_v3 §93).
      - name: Install dependencies
        run: |
          python -m pip install "uv==0.13.4"
          python -m uv pip install --system --compile-bytecode -r requirements.txt -r requirements-test.txt

      - name: Provide providers.json
        run: cp providers.json.example providers.json

      # The parallel default, not `-n logical`, for tests.yml's measured
      # reason: asking for the other 30% of the cores was not faster under
      # either distribution mode, alternated three runs a side (batch 109,
      # and again in batch 110).
      #
      # NOT "because the suite is floor-bound on test_tui.py", which is what
      # this said until batch 151 (S19-02). Batch 114 retired that floor and
      # tests.yml's own comment says so in capitals -- so the conclusion here
      # was right and its premise had been dead for 37 batches, which is
      # worse than being wrong: someone who re-measured the floor, found it
      # gone, and changed this line would have been reasoning correctly.
      - name: Run the suite (informational)
        run: python -m pytest -q

  windows-subset:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      # uv, for the reason tests.yml's docs-consistency job gives
      # (ROADMAP_v3 §93).
      - name: Install dependencies
        run: |
          python -m pip install "uv==0.13.4"
          python -m uv pip install --system --compile-bytecode -r requirements.txt -r requirements-test.txt

      - name: Provide providers.json
        run: cp providers.json.example providers.json

      - name: Run platform-sensitive tests
        run: python -m pytest tests/test_shell.py tests/test_posture.py -q

      # #230 (batch 226): the integration tests on Windows, where the
      # fallback shell's wait test means something, the three MCP orphan
      # tests take the platform's own process tree, and the three uv tests
      # (ROADMAP_v3 §93) meet NTFS hardlinks and the npm launcher's spawn of
      # uv.exe, which no fake can stand in for. tests.yml's
      # `integration` job runs the Linux half. The one skip allowed is the
      # bundle image test: this runner's Docker builds Windows images only.
      - name: Run the integration tests
        shell: bash
        run: |
          python -m pytest -m integration -q -n0 -rs | tee integration.txt
          if grep "^SKIPPED" integration.txt | grep -v "running Linux containers"; then
            echo "::error::an integration test skipped on the runner set up to run it"
            exit 1
          fi
