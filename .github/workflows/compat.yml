# Compatibility matrix, lean by design: the full suite stays on 3.11/Ubuntu
# in tests.yml, and these two jobs cover what that gate cannot see.
#
# py313-info: pyproject advertises 3.11-3.13, but CI only ran 3.11 -- so a
# 3.12-only syntax slip (PEP 701 f-string tokens, the exact construct
# tools/_math_common.py reasons about) or a version-gated stdlib change
# lands green and breaks a user. Informational (`continue-on-error`)
# until sustained green; promoting it to required is one flag flip once
# the failures it finds are fixed rather than recorded.
#
# windows-subset: development happens on win32, CI runs Ubuntu. The
# Windows-only defects this project has actually had -- UNC `realpath`
# raising inside `_within` (Q3), `list2cmdline` quoting, NUL-path and
# symlink behaviour, POSIX toolchains resolved off PATH (EP8) -- all live
# in test_shell.py and test_posture.py. Running those two files on
# windows-latest covers the platform split for ~2 min instead of a second
# 15-minute suite. Same fresh-clone steps (providers.json is needed even
# here), same `python -m pytest` rule.
#
# Every job here takes pytest.ini's parallel default. For windows-subset
# that is nearly a no-op and the arithmetic says why: it names two files,
# and `--dist loadscope` splits a file only at its CLASS boundaries, so
# the ceiling is however many classes those two files have between them
# rather than the core count. (Before batch 110 the mode was loadfile and
# the ceiling was two workers flat.)

name: compat

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  py313-info:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The suite's own packages, which stopped being runtime
          # dependencies of the distribution in batch 136 (S18-07).
          pip install -r requirements-test.txt

      - name: Provide providers.json
        run: cp providers.json.example providers.json

      # The parallel default, not `-n logical`, for tests.yml's measured
      # reason: asking for the other 30% of the cores was not faster under
      # either distribution mode, alternated three runs a side (batch 109,
      # and again in batch 110).
      #
      # NOT "because the suite is floor-bound on test_tui.py", which is what
      # this said until batch 151 (S19-02). Batch 114 retired that floor and
      # tests.yml's own comment says so in capitals -- so the conclusion here
      # was right and its premise had been dead for 37 batches, which is
      # worse than being wrong: someone who re-measured the floor, found it
      # gone, and changed this line would have been reasoning correctly.
      - name: Run the suite (informational)
        run: python -m pytest -q

  windows-subset:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The suite's own packages, which stopped being runtime
          # dependencies of the distribution in batch 136 (S18-07).
          pip install -r requirements-test.txt

      - name: Provide providers.json
        run: cp providers.json.example providers.json

      - name: Run platform-sensitive tests
        run: python -m pytest tests/test_shell.py tests/test_posture.py -q
