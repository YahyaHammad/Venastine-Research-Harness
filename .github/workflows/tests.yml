# Issue #11 -- nothing ran the test suite automatically.
#
# The suite is fully offline by design (the root conftest.py stubs six SDK
# packages into sys.modules at import time), so this needs no secrets, no
# network at test time, and no services. It is `pip install` + `pytest`.
#
# Two things a fresh clone needs that a working copy already has, both
# documented in AGENTS.md and both easy to lose in CI:
#
#   * providers.json. Gitignored, template at providers.json.example.
#     api_initialization() needs the provider ENTRY to exist even though the
#     key inside it stays empty -- without it, tests in
#     test_loop_stop_conditions, test_loop_tool_dispatch and test_agents fail
#     with `ValueError: Unknown provider: ANTHROPIC`. "Offline, no API keys"
#     is true; "no config file" is not.
#   * Python 3.11. mcp_client/client.py uses asyncio.timeout, which is 3.11+.
#     Declared in pyproject.toml's requires-python since #144 -- the pin below
#     matches it rather than being the only record of it.
#
# `-m integration` is deliberately NOT run: pytest.ini already excludes it
# from the default invocation, and it currently fails for an unrelated reason
# (issue #10 -- the child-process detector greps a truncated `ps` line). Add
# it here when #10 closes.

name: tests

on:
  push:
  pull_request:

# Least privilege: this workflow only reads the checkout.
permissions:
  contents: read

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate (~10s): doc drift fails here instead of after the full
  # 15-minute suite below. Same fresh-clone steps, same `python -m pytest`
  # rule (see the comment on the full job).
  #
  # It runs ONE narrowed invocation, which is why the two count checks used
  # to skip in it and this gate could not fail on the drift it exists for --
  # c5fd7c2 passed here at 09:47 and failed the full suite on exactly those
  # two tests at 09:53. test_docs_consistency.py collects the suite in a
  # subprocess for this shape alone; ~4.6s of the runtime below is that.
  docs-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The suite's own packages, which stopped being runtime
          # dependencies of the distribution in batch 136 (S18-07).
          pip install -r requirements-test.txt

      - name: Provide providers.json
        run: cp providers.json.example providers.json

      # `-n0`: pytest.ini turns parallelism on by default (batch 109), and
      # this job runs ONE file, so every worker but one would idle while
      # each still paid its own interpreter start and collection. On a gate
      # whose whole value is ~10s, that is the wrong trade.
      - name: Run docs-consistency
        run: python -m pytest tests/test_docs_consistency.py -q -n0

  pytest:
    runs-on: ubuntu-latest
    # Measured at ~15 min on ~4200 tests (DEVLOG Batch 75); 15 left no
    # headroom and a loaded runner read as a hang.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The suite's own packages, which stopped being runtime
          # dependencies of the distribution in batch 136 (S18-07).
          pip install -r requirements-test.txt

      - name: Provide providers.json
        run: cp providers.json.example providers.json

      # `python -m pytest`, not a bare `pytest`: AGENTS.md records that a
      # pytest on PATH from a separate tool install runs in its own
      # environment and sees none of the project's dependencies.
      #
      # NO `-n` HERE, AND THAT WAS MEASURED RATHER THAN ASSUMED (batch 109,
      # re-measured under loadscope in batch 110). pytest.ini's `-n auto`
      # gives 70% of the cores; the obvious CI move is `-n logical` for the
      # other 30%, since a runner has nothing else to do with itself. It
      # buys nothing, under EITHER distribution mode.
      #
      # Measured twice. Under loadfile: `-n auto` 2:15 / 2:17 / 2:18 / 2:21
      # against `-n logical` 2:37 / 3:01 / 3:06. Under loadscope, alternated
      # on the same commit: `-n auto` 2:09 / 2:10 against `-n logical`
      # 2:13 / 2:13 / 2:14. So CI runs exactly what a contributor runs.
      #
      # THE FLOOR THAT USED TO BIND IS GONE, AND THIS RUNNER NEVER FELT IT
      # (batch 114; TECHNICAL_DEBT 30 closed, and this comment said
      # otherwise until batch 116). Until then the slowest single GROUP set
      # the wall time, and under `--dist loadscope` that was test_tui.py's
      # 183 module-level tests as ONE group -- a test outside a class is
      # grouped by its MODULE -- at 292 node ids. (This comment used to say
      # "28", which was the sync-only count and was wrong before 114 made
      # it obsolete.) They are 41 classes now, and the developer-machine
      # suite went 138.1s -> 85.9s, 1.61x, alternated three runs a side.
      #
      # DO NOT READ THAT 1.61x AS A CI NUMBER. `-n auto` is 70% of the
      # cores, so this 4-core runner takes 3 workers and its ideal share
      # was already above the old floor -- CI was worker-bound, not
      # floor-bound, and gained nothing from the change. What it did gain
      # is more concurrency between TUI groups that used to be serialised
      # on one worker, which is how batch 116's flake surfaced here first.
      - name: Run the suite
        run: python -m pytest -q
