# Batch 35 -- the npm channel. BUILT AND ARMED (2026-09-04): the tag trigger
# below went live by deliberate edit, which is the act this file used to hold
# back. What remains on the maintainer, in order:
#
#   1. PUBLIC REPOSITORY. Publishing to npm makes this source public
#      regardless of the GitHub repository's visibility, and --provenance
#      needs a public repo, so the repository goes public first.
#   2. NPM_TOKEN. The repository secret that authenticates publishing.
#      Without it the run reports that the channel is unarmed and
#      downgrades itself to a dry run rather than failing red -- so arming
#      the trigger while the secret is still missing is safe, and every tag
#      push before the secret exists is a full rehearsal of the release.
#
# The dry_run INPUT still defaults to TRUE on workflow_dispatch, so the
# default manual run packs and validates and uploads nothing; a real publish
# by hand unchecks the box. A TAG PUSH carries no input and means it: with
# NPM_TOKEN set it publishes for real, and a published npm version can never
# be replaced -- only deprecated.
#
# NOTE ON PROVENANCE: `npm publish --provenance` attests the tarball to this
# repository and commit, which is the answer to "how do I know the npm folder
# is the GitHub folder". It requires a PUBLIC repository, so it will only
# work once the repo is public -- which is the same precondition as
# publishing at all.

name: publish (npm)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without uploading (leave checked unless you mean it)"
        type: boolean
        default: true
        required: true

  # ARMED 2026-09-04. A pushed `v*` tag runs this workflow without a
  # dry_run input: with NPM_TOKEN set it publishes, without the secret it
  # rehearses. Tag the release commit (`git tag v0.1.0 && git push origin
  # v0.1.0`) only when both preconditions above hold.
  push:
    tags:
      - "v*"

# Least privilege. `id-token: write` exists only so provenance can be minted;
# nothing here writes to the repository.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # The tarball is Python source, so the suite is what says it is
      # publishable. Mirrors tests.yml deliberately -- same pin, same
      # fresh-clone step, same `python -m pytest` rather than a bare pytest.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Provide providers.json
        run: cp providers.json.example providers.json

      - name: Run the suite
        run: python -m pytest -q

      # Defence in depth. `files` in package.json is an allowlist that does not
      # name providers.json, so the step above cannot leak into the tarball --
      # but the file is sitting in the working directory at pack time, and
      # "it cannot happen because of a list somewhere else" is exactly the
      # assumption worth not making about a credential file.
      - name: Remove the test credentials file before packing
        run: rm -f providers.json

      # Version parity + secret/licence audit of the actual tarball. Also runs
      # automatically via prepublishOnly; running it explicitly means a failure
      # is reported as its own red step rather than inside npm's output.
      - name: Prepublish check
        run: node scripts/prepublish-check.mjs

      - name: Is the channel armed?
        id: armed
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Channel not armed::No NPM_TOKEN secret is configured, so this run cannot publish. Falling back to a dry run."
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (dry run)
        if: ${{ inputs.dry_run || steps.armed.outputs.armed != 'true' }}
        run: |
          npm publish --dry-run
          echo "::notice title=Nothing was uploaded::dry_run=${{ inputs.dry_run }}, armed=${{ steps.armed.outputs.armed }}"

      - name: Publish
        if: ${{ !inputs.dry_run && steps.armed.outputs.armed == 'true' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
