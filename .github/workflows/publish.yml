# Batch 35 -- the npm channel. BUILT AND ARMED (2026-09-04): the tag trigger
# below went live by deliberate edit, which is the act this file used to hold
# back. The repository is public, which publishing and provenance both need.
#
# TRUSTED PUBLISHING SINCE BATCH 237 (ROADMAP_v3 §91, A89). npm retired
# token publishing for OIDC: this job holds no npm token at all. npm trusts
# a run of THIS FILE in this repository, as configured on npmjs.com under the
# package's Settings -> Trusted publishing (organization or user
# YahyaHammad, repository Venastine-Research-Harness, workflow filename
# publish.yml, no environment). The job's `id-token: write` is what lets it
# prove that, and npm needs CLI 11.5.1 and Node 22.14.0 at the least.
#
# ARMING is the repository variable NPM_TRUSTED_PUBLISHING. Until it is `on`
# the run reports that the channel is unarmed and downgrades itself to a dry
# run rather than failing red, so every tag before then is a full rehearsal
# of the release. Set it once the trusted publisher exists on npmjs.com, and
# push the next tag within two days: npm expires a trusted publisher that has
# not published once in that time.
#
# The dry_run INPUT still defaults to TRUE on workflow_dispatch, so the
# default manual run packs and validates and uploads nothing; a real publish
# by hand unchecks the box. A TAG PUSH carries no input and means it: armed,
# it publishes for real, and a published npm version can never be replaced
# -- only deprecated. release.yml pushes such a tag after every merged pull
# request (A86).
#
# NOTE ON PROVENANCE: trusted publishing attests the tarball to this
# repository and commit without a flag, which is the answer to "how do I know
# the npm folder is the GitHub folder". It needs a public repository and a
# GitHub-hosted runner.

name: publish (npm)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without uploading (leave checked unless you mean it)"
        type: boolean
        default: true
        required: true

  # ARMED 2026-09-04. A pushed `v*` tag runs this workflow without a
  # dry_run input: armed, it publishes; unarmed, it rehearses. release.yml
  # tags each merge's release commit; a tag pushed by hand must name a commit
  # whose package.json and pyproject.toml already say that version: the
  # prepublish check refuses any other tag (A78).
  push:
    tags:
      - "v*"

# Least privilege. `id-token: write` is the OIDC token npm's trusted
# publishing accepts in place of a secret, and mints the provenance; nothing
# here writes to the repository.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later; the npm a Node release
      # bundles is whatever it shipped with, so the CLI is pinned here.
      - name: Use an npm that publishes through OIDC
        run: npm install -g npm@11.21.1

      # The tarball is Python source, so the suite is what says it is
      # publishable. Mirrors tests.yml deliberately -- same pin, same
      # fresh-clone step, same `python -m pytest` rather than a bare pytest,
      # and since batch 109 the same parallel default (tests.yml carries
      # the measurement showing CI should not ask for the other 30%).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The suite's own packages, which stopped being runtime
          # dependencies of the distribution in batch 136 (S18-07).
          pip install -r requirements-test.txt

      - name: Provide providers.json
        run: cp providers.json.example providers.json

      - name: Run the suite
        run: python -m pytest -q

      # Defence in depth. `files` in package.json is an allowlist that does not
      # name providers.json, so the step above cannot leak into the tarball --
      # but the file is sitting in the working directory at pack time, and
      # "it cannot happen because of a list somewhere else" is exactly the
      # assumption worth not making about a credential file.
      - name: Remove the test credentials file before packing
        run: rm -f providers.json

      # S18-03 (batch 141). THE SECRET SCAN, ON THE PUBLISH PATH.
      #
      # It was not here, and nothing made it a precondition: this workflow
      # declares no `needs:` and reads no other workflow's verdict, so
      # gitleaks ran CONCURRENTLY with the job that publishes -- and a
      # published npm version can never be replaced, only deprecated.
      # Measured on the one release tag that exists, v0.2.0: two runs, tests
      # and publish, no scanner among them.
      #
      # It is not redundant with the step below. `prepublish-check.mjs`
      # matches on FILENAMES, so a credential pasted into a file that is
      # SUPPOSED to ship -- config.yaml, a prompt under prompts/, an agent
      # definition -- is named by no entry of its denylist and passes every
      # check it makes. That is the case gitleaks exists for, and
      # `bandit.yml` says why it is a separate tool: "`api_key` does not
      # match that regex at all, so B105/B106 never covered this project's
      # actual credential shape".
      #
      # AFTER the `rm` above, deliberately: this job copies
      # providers.json.example into place for the suite, so scanning earlier
      # would scan a deliberately-planted fake. `gitleaks.toml` allowlists
      # that filename and it would pass -- but passing because another list
      # happens to cover it is exactly the assumption the step above refuses
      # to make about a credential file.
      #
      # Inlined rather than referenced, which is this file's own idiom, with
      # gitleaks.yml's pin and digest (S18-05). `--source .` stays RELATIVE:
      # an absolute path makes every .gitleaksignore fingerprint unmatchable.
      - name: Install Gitleaks
        run: |
          curl -sSL --fail -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan for secrets before publishing
        run: |
          ./gitleaks detect --source . --no-git -c .github/gitleaks.toml -v
          rm -f gitleaks

      # Version parity + secret/licence audit of the actual tarball. Also runs
      # automatically via prepublishOnly; running it explicitly means a failure
      # is reported as its own red step rather than inside npm's output.
      #
      # On a run from a tag it first refuses unless the tag is `v` +
      # package.json's version, before it packs anything (batch 162,
      # ROADMAP_v3 A78). This file reads no tag name itself, and v0.3.1 packed
      # 0.2.0 here with nothing to say so.
      - name: Prepublish check
        run: node scripts/prepublish-check.mjs

      # A89: the repository variable, not a secret -- trusted publishing has
      # no secret to look for. `on` says the trusted publisher exists on
      # npmjs.com; anything else rehearses.
      - name: Is the channel armed?
        id: armed
        env:
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ "$TRUSTED" != "on" ]; then
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Channel not armed::The repository variable NPM_TRUSTED_PUBLISHING is not on, so this run cannot publish. Falling back to a dry run."
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (dry run)
        if: ${{ inputs.dry_run || steps.armed.outputs.armed != 'true' }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          ARMED: ${{ steps.armed.outputs.armed }}
        run: |
          npm publish --dry-run
          echo "::notice title=Nothing was uploaded::dry_run=$DRY_RUN, armed=$ARMED"

      # No token in the environment: npm exchanges the job's OIDC token for a
      # short-lived publish credential, and adds the provenance on its own.
      - name: Publish
        if: ${{ !inputs.dry_run && steps.armed.outputs.armed == 'true' }}
        run: npm publish --access public
