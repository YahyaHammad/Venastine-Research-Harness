# ROADMAP_v3 §94 slice 4 (PL34): every pull request's plugin review -- the
# boundary, the scan and the one comment -- from main's code, on files
# read as data.
#
# WHAT IT DECIDES (scripts/plugin_ci.py review):
#   plugin-boundary  fails a pull request that changes plugins/ AND anything
#                    else, labels it plugin:mixed and says which files are
#                    on each side. It never closes the pull request; the
#                    owner decides whether this check is required.
#   plugin-scan      fails on a plugin that is invalid, did not raise its
#                    version, takes a name another plugin has, or has a high
#                    scanner finding (core/plugin_scan.py) -- unless someone
#                    with write access added plugin:scan-reviewed at the
#                    pull request's current head. A new commit removes that
#                    label, so a review covers exactly the code it saw, and
#                    one added without write access is removed at once. A
#                    PyPI or OSV lookup that did not answer fails it too.
# It keeps one comment up to date with all of that, mentions the changed
# plugins' maintainers OF RECORD -- the base branch's manifest, so a pull
# request cannot make it mention whoever it lists -- and asks for review
# from those with write access, since GitHub refuses a review request for
# anyone else. A plugin-only pull request gets release:skip on its first
# review, for release.yml, unless it already has a release:* label.
#
# pull_request_target, NOT pull_request: it runs this file as main has it,
# with a token that can write labels and comments. That is safe ONLY
# because it never checks out or runs the pull request's code: the
# checkout is main's, every plugin file is fetched through the API by
# blob and checked against its tree's hash, and core/plugin_scan.py reads
# Python with `ast` and never imports it. Values from the event reach the
# script through env:, never inside run:.

name: plugin-review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions: {}

concurrency:
  group: plugin-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read        # the trees and blobs, and main's checkout
      issues: write         # labels and the comment
      pull-requests: write  # the file list and review requests
    outputs:
      boundary: ${{ steps.review.outputs.boundary }}
      scan: ${{ steps.review.outputs.scan }}
    steps:
      # The base branch's tip, pull_request_target's own ref: never the
      # pull request's head, whose code this job must not run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      # 3.13, the sandbox image's: the scanner parses a plugin's Python
      # with this interpreter's `ast`, and a plugin is written for 3.13.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      # requirements.txt's pin; the format check reads plugin.yaml with it.
      - name: Install the review's one dependency
        run: python -m pip install "pyyaml==6.0.3"

      - name: Review
        id: review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
        run: python scripts/plugin_ci.py review

  plugin-boundary:
    needs: review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: The boundary
        env:
          VERDICT: ${{ needs.review.outputs.boundary }}
        run: |
          if [ "$VERDICT" != "pass" ]; then
            echo "::error title=Mixed pull request::This pull request changes plugins/ and the rest of the repository, or could not be reviewed. The review comment lists the files on each side."
            exit 1
          fi

  plugin-scan:
    needs: review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: The scan
        env:
          VERDICT: ${{ needs.review.outputs.scan }}
        run: |
          if [ "$VERDICT" != "pass" ]; then
            echo "::error title=Plugin review::A changed plugin has a problem or a high scanner finding. The review comment says which."
            exit 1
          fi
