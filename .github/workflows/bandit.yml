# Bandit SAST, baseline-blocking (advisory would train readers past red).
#
# Invocation shape matters twice here:
#   * `git ls-files '*.py'` feeds ONLY tracked files. Bandit does NOT
#     respect .gitignore, so a bare `bandit -r .` would also scan
#     providers.json-adjacent residue, output/ and __pycache__ -- the
#     false-positive farm the rollout plan verified locally (20 gitleaks
#     hits, 11 of them .pyc).
#   * `-s B101,B105,B106`: three skips with one shape -- a check that
#     fires on every PR is a check nobody reads.
#       - B101, pytest asserts, are idiomatic (6037 sites, all in tests/;
#         production carries zero asserts, verified at rollout).
#       - B105/B106 match on the NAME, not the value:
#         `(^|_)(pas+wo?r?d|pass(phrase)?|pwd|token|secrete?)(_|$)`. This
#         project's two central nouns are research PASSES and streaming
#         TOKENS, so the heuristic is reading the domain vocabulary.
#         Measured on the first run that executed this file: 65 findings,
#         52 B105 and 13 B106, over `pass_id`, `pass_input` and
#         `token_delta`, and NOT ONE a real credential. The four outside
#         tests/ are `{"pass": "Review"}`, `"max_token_budget": None`,
#         `THREAD_KIND_RESEARCH_PASS = "research_pass"` and
#         `token == "--file"`.
#     A baseline cannot absorb that class, which is the part worth
#     recording: it matches on the literal STRING VALUE, so every new
#     fixture phrase is a NEW finding. Eight commits introduced one
#     between 2026-08-05 and 2026-09-10 -- a regeneration every four days,
#     and regeneration is all-or-nothing across the file, so each one
#     silently re-baselines whatever real B603 or B608 landed beside it.
#     That trade is the opposite of what a baseline is for.
#
#     The gap this leaves is not the one it looks like. `api_key` does not
#     match that regex at all, so B105/B106 never covered this project's
#     actual credential shape -- gitleaks is that gate, and it is a
#     separate workflow for that reason.
#   * `-b .github/bandit-baseline.json`: fails on a new (file, test id,
#     MESSAGE) triple -- which is NOT the same as "fails only on NEW
#     issues", the sentence that stood here until batch 141. Bandit's
#     `Issue.__eq__` matches on text/severity/cwe/confidence/filename/test
#     and NOT on line number or code, and the comparison is set
#     membership, so a SECOND subprocess call in a file that already
#     carries a baselined B603 is silent. Measured: security/sandbox.py
#     went 7 -> 18 B603 findings across this branch and this job reported
#     none of them. `bandit-count-check.py` below is the other half, and
#     the 21 findings it surfaced were triaged into per-site `# nosec`
#     annotations in batch 141 rather than into this file. (129
#     triaged at rollout: sandbox/subprocess surface, bound-param SQL in
#     pipeline_storage, arXiv ET feed, redaction-test fixtures -- all
#     accepted-risk with the reasoning in the rollout summary). Bandit
#     matches on text/severity/cwe/confidence/filename/test, NOT line
#     numbers, so normal edits do not invalidate it. 64 of those 129 are
#     the live half now; the 65 B105/B106 entries are inert under the skip
#     above and are left in place rather than regenerated away, because
#     regenerating to tidy is the habit this file is trying not to build.
#
# Regenerating the baseline (deliberate step, like moving an exact pin):
#   git ls-files '*.py' | xargs bandit -s B101,B105,B106 -f json -o .github/bandit-baseline.json
# then normalize filename separators to `./` (Bandit stores
# os.path.join(".", f), which is `.\` on Windows and `./` on Linux --
# the checked-in file is the Linux form CI produces) and re-triage the
# delta. Never regenerate blindly to make red green.
#
# Offline suite guarantee unaffected: static analysis, no providers.json,
# no network.

name: bandit

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bandit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install "bandit==1.9.4"

      - name: Bandit (new issues only)
        run: |
          files=$(git ls-files '*.py')
          # shellcheck disable=SC2086
          bandit $files -s B101,B105,B106 -b .github/bandit-baseline.json -q

      # The half `-b` cannot check. BESIDE it, not instead of it: `-b`
      # matches on message text and still catches a reworded finding at an
      # unchanged count, while this catches a second occurrence at an
      # unchanged message. Neither subsumes the other, and the script's
      # header carries the measurement.
      - name: Bandit (a baselined file cannot absorb a second finding)
        run: python scripts/bandit-count-check.py
