# CodeQL SAST: the default security suite per push/PR, security-and-quality
# weekly.
#
# Split is cost control: the suite already runs ~15 min, and the
# security-and-quality pack roughly doubles analysis time for findings
# that are mostly hygiene. Security red blocks the PULL REQUEST that
# introduced it; quality red on the weekly run is triaged, not reverted
# around.
#
# WHERE THAT BLOCKING COMES FROM, because nothing in this file does it
# (batch 158, A67, closing TECHNICAL_DEBT 76). `analyze` uploads SARIF to
# code scanning and exits 0 whatever it found -- there is no
# fail-on-severity input to go looking for. The red is GitHub's own
# `CodeQL` check, which code scanning posts on pull requests only, at a
# threshold that is a repository setting (Settings -> Code security ->
# Code scanning -> "Check failure"). Measured on PR #200: 13 high-severity
# alerts failed it, so high blocks; the exact setting was not readable
# with the token that measured it. A direct PUSH records its alerts and
# fails nothing.
#
# Both jobs read ../codeql/codeql-config.yml, which holds PATHS and never
# queries. It skips tests/, and only because tests/ never ships; that file
# carries the reason and the test that bounds it.
#
# BOTH SUITE NAMES WERE WRONG on the first run that ever executed this
# file, in opposite directions, and only one of them said so:
#
#   * `queries: security-only` is not a CodeQL suite. `database init`
#     stopped with "Query pack security-only cannot be found" before a
#     single query ran. The built-ins are the DEFAULT suite -- selected by
#     omitting `queries:` entirely, and already the high-precision
#     security set this job wants -- plus `security-extended` and
#     `security-and-quality`.
#   * the weekly job omitted `queries:` as well, which is not "everything"
#     but that same default. It would have re-run the push job's scan once
#     a week and reported a quality finding never. Silent, because a valid
#     configuration cannot fail.
#
# So omitting the key is the FIX on one job and the BUG on the other. Do
# not "make them consistent".
#
# Static analysis only: no providers.json, no secrets, no services.
# Python autobuild needs nothing here (no compilation step); explicit
# `build-mode: none` says so rather than letting the action guess.

name: codeql

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

# The event is in the group since batch 169: keyed on the ref alone, the
# Monday schedule and a push to main shared a group, and whichever started
# second cancelled the other -- and a cancelled push run is a failed check
# to the deploy gate (scripts/deploy_gate.py), which holds that deploy.
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-security:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: python
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
          # No `queries:` -- that IS the default suite. See the header.

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1

  analyze-quality:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: python
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
