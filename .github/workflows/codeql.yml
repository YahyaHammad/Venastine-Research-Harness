# CodeQL SAST: the default security suite per push/PR, security-and-quality
# weekly.
#
# Split is cost control: the suite already runs ~15 min, and the
# security-and-quality pack roughly doubles analysis time for findings
# that are mostly hygiene. Security red blocks the change that introduced
# it; quality red on the weekly run is triaged, not reverted around.
#
# BOTH SUITE NAMES WERE WRONG on the first run that ever executed this
# file, in opposite directions, and only one of them said so:
#
#   * `queries: security-only` is not a CodeQL suite. `database init`
#     stopped with "Query pack security-only cannot be found" before a
#     single query ran. The built-ins are the DEFAULT suite -- selected by
#     omitting `queries:` entirely, and already the high-precision
#     security set this job wants -- plus `security-extended` and
#     `security-and-quality`.
#   * the weekly job omitted `queries:` as well, which is not "everything"
#     but that same default. It would have re-run the push job's scan once
#     a week and reported a quality finding never. Silent, because a valid
#     configuration cannot fail.
#
# So omitting the key is the FIX on one job and the BUG on the other. Do
# not "make them consistent".
#
# Static analysis only: no providers.json, no secrets, no services.
# Python autobuild needs nothing here (no compilation step); explicit
# `build-mode: none` says so rather than letting the action guess.

name: codeql

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-security:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
          # No `queries:` -- that IS the default suite. See the header.

      - uses: github/codeql-action/analyze@v3

  analyze-quality:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
