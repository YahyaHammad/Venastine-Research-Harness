# Secret scan: working tree only, never history.
#
# `--no-git` is the load-bearing flag. A history scan would flag every
# rotated or test-fixture secret ever committed (including the planted
# redaction fixtures), turning one cleanup into permanent red. The threat
# that matters here is a secret ENTERING the tree: providers.json-shaped
# keys, .env entries, pasted tokens.
#
# Two companion files do the tuning, for different reasons:
#   * `.github/gitleaks.toml` (-c): path allowlist for gitignored runtime
#     residue Gitleaks does NOT skip on its own -- providers.json (real
#     local keys, verified locally) and __pycache__/*.pyc (bytecode copies
#     of fixtures). CI scans the empty example-derived providers.json,
#     which is clean; the allowlist is what keeps local runs honest too.
#   * `.gitleaksignore` (auto-picked from the repo root): fingerprints of
#     the six INTENTIONAL fake secrets across
#     tests/test_policy_enforcement.py (five) and tests/test_session_tools.py
#     (one) -- the suite asserts they redact. A moved fixture re-fires
#     until re-blessed: a tripwire, not friction.
#
#     This said "the six ... in tests/test_policy_enforcement.py" until
#     batch 141 (S18-09). Item 18 records the change that falsified it --
#     "a planted fake secret added 2026-09-17" got its fingerprint and this
#     header one directory over did not move with it. `.gitleaksignore`'s
#     own two blocks have always said it correctly.
# Adding a fingerprint for a REAL credential is never the fix; rotation is.

name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Working-tree scan needs no history; a shallow checkout keeps
          # the job fast and is all `--no-git` reads.
          fetch-depth: 1

      # Pinned binary, not the floating action: D22's exact-pin rule
      # applies to CI tooling too -- a scanner upgrade must be a deliberate
      # step with a re-triage, not something Friday's run inherits.
      #
      # AND THE DIGEST, since batch 141 (S18-05). An exact version without
      # one is still a mutable reference: a GitHub release asset can be
      # deleted and re-uploaded under the same tag, so the version pin
      # above bought ordering and not identity. The checksum is the
      # project's published `gitleaks_8.30.1_checksums.txt` entry, and it
      # moves with the version in the same step -- which is what makes a
      # scanner upgrade "a deliberate step with a re-triage" rather than
      # editing a version string.
      #
      # `--fail` matters for the other half: `curl -sS` without it writes
      # the error page to the output file and exits 0, so a MISSING asset
      # used to be caught only downstream by `tar` choking on non-gzip.
      # Now absence fails at the download and substitution fails at the
      # digest, each where it happens.
      - name: Install Gitleaks
        run: |
          curl -sSL --fail -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan working tree
        run: ./gitleaks detect --source . --no-git -c .github/gitleaks.toml -v
