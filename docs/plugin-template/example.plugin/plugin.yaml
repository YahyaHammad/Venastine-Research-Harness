# A plugin's manifest. Every field is described in docs/PLUGINS.md;
# anything not listed there is refused, so a typo is an error, not a
# silently ignored line.
format: 1
# Must match the folder: this file sits in example.plugin/.
name: example
# Quote it, or YAML reads 1.0 as a number.
version: "1.0.0"
description: A worked example of the plugin format, with one skill, one agent, one tool and two settings.
authors: [Venastine Research Harness contributors]
# GitHub usernames asked to review a change to this plugin.
maintainers: []
license: Apache-2.0
# The oldest harness this plugin works on, if it needs a newer one than
# the first with plugins:
# min_harness: "0.3.14"
settings:
  detail:
    type: choice
    choices: [brief, full]
    default: brief
    description: How much the outline tool writes.
  max_items:
    type: integer
    default: 5
    min: 1
    max: 20
    description: The longest outline the outline tool returns.
# What the model can call. Each tool's code is tools/<name>.py (a hyphen
# in the name becomes an underscore), with a run(params, context)
# function. The harness reads this list without running any of it.
tools:
  - name: outline
    description: >-
      Turn a list of points into a short outline, numbered when the
      plugin's detail setting is full, and no longer than its max_items
      setting allows.
    input_schema:
      type: object
      properties:
        points:
          type: array
          items: {type: string}
          description: The points, in order.
      required: [points]
# What its tools may touch. This one needs neither, so it asks for
# neither; a tool that reads files would say workspace: read.
access:
  workspace: none
  network: false
