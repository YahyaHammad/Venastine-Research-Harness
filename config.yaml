# Venastine harness configuration.
#
# Every tunable value the harness has. `config.py` reads this file once at
# import through `config_schema.py` and publishes the values as module
# attributes, so the names here are the lower-cased form of the constants the
# code uses: `max_tokens` is `config.MAX_TOKENS`.
#
# WHY THE HISTORY IS NOT IN HERE. Each of these numbers was argued, several
# were reversed once, and the arguments run to hundreds of lines -- they live
# in CONFIG_ARCHITECTURE.md, section by section, under the name used here.
# Read it before changing a value. The comments below say what a value DOES;
# that document says why it is what it is.
#
# THREE THINGS TO KNOW BEFORE EDITING.
#
# 1. This file ships with the harness and has exactly ONE location, beside
#    config.py. There is no user-level or project-level copy and no
#    environment variable that redirects it. That absence is deliberate and
#    is a security property rather than an oversight: settings.json refuses
#    shell_approval_mode, ensemble_models, critic_model and embedder_model by
#    name precisely because a project's settings.json beats the user's and
#    arrives with a directory you cloned.
#
# 2. Keys marked AUTHORITY decide what this harness may do to its host, or
#    name a provider it sends your research content to. Nothing UNATTENDED
#    can change them -- not a tool call, not a settings file, not an
#    environment variable. This file is the only route and it needs a
#    human: `/config` writes one, but only after saying what the key
#    permits and asking (batch 84).
#
# 3. Values are read ONCE, at startup. Editing this file while the harness is
#    running changes nothing until the next launch.
#
# A missing key, an unknown key, a duplicated key or a value of the wrong
# type is a startup error naming the key. There are no defaults behind this
# file.

# ======================================================================
# Model and loop
# ======================================================================

# The model every path uses when nothing more specific speaks.
# --model > settings.json default_model > this. AGENT_MODEL overrides.
model_name: claude-sonnet-5

# Per-call OUTPUT ceiling, sent as max_tokens / max_output_tokens /
# max_completion_tokens. On current Anthropic models it bounds thinking
# and response text together, so effort spends from the same budget.
max_tokens: 16000

# The default step ceiling: every chat turn, every research pass, and any
# agent whose frontmatter names no max_steps or names an invalid one.
max_iterations: 50

# How many more times ONE model call is attempted when the provider fails in
# a way that can pass: a dropped connection, a 408/409/429/5xx, or an error
# sent inside a stream that had already opened. Total attempts per call is
# this plus one. The openai and anthropic SDKs still retry a request that
# fails before its stream opens, inside each attempt. 0 turns this off.
model_call_max_retries: 2

# Seconds before the first of those retries. Each later retry waits twice as
# long, with up to 25% jitter either way; a server's retry-after can make a
# wait longer, never shorter, capped at 60s.
model_call_retry_base_delay_s: 3.0

# ======================================================================
# Subagents
# ======================================================================

# How deep spawn_subagent may nest, checked against
# ToolContext.subagent_depth.
subagent_max_depth: 2

# How many calls of one response may run at once, for tools whose ToolSpec
# declares `parallel`. A ceiling, not a target: more calls run in waves of
# this size. 1 makes the parallel path behave exactly like the sequential
# one, which is the escape hatch if concurrency is ever suspect.
subagent_max_parallel: 3

# ======================================================================
# The active agent
# ======================================================================

# The agents shift+tab steps through in the TUI's prompt, in this order.
# The plain harness ("default") is always the first stop and is not
# listed. A name no agent tier provides is skipped and named once. An
# empty list gives shift+tab back to moving focus. /agent <name> reaches
# every agent, listed here or not.
agent_cycle:
  - plan
  - build

# ======================================================================
# Deep research pipeline
# ======================================================================

# Revise/re-validate loop iterations per claim before the pipeline falls
# back.
max_pipeline_retries: 2

# Corrective follow-up attempts when a pass returns malformed JSON.
# Total attempts per pass is this plus one.
max_json_retries: 2

# ======================================================================
# Ensemble mode
# ======================================================================

# Run Pass 1 once per `ensemble_models` entry. A settings.json
# `ensemble_mode` outranks this; the roster below has no settings key.
ensemble_mode: false

# AUTHORITY -- no settings.json key exists at any tier, because a roster chooses
# which providers N research passes call. N is its length and is never
# configured separately. Fewer than two DISTINCT (provider_name, model)
# pairs is refused: one model cannot disagree with itself.
# null, with ensemble_mode false, is the shipped configuration. Example:
#   ensemble_models:
#     - {provider_name: ANTHROPIC, model: claude-opus-5}
#     - {provider_name: OPENAI, model: gpt-5.1}
ensemble_models: null

# ======================================================================
# Sampling-parameter support
# ======================================================================

# Models that reject temperature / top_p / top_k outright, or ignore them.
# core/client.py omits those parameters entirely for anything listed, with a
# WARNING. Steering on these happens through prompting and
# model_effort_levels instead.
#
# The two gemini names IGNORE the parameters (ROADMAP_v3 §87): no error and
# no effect. Google says every later Gemini will do the same, then refuse
# them with a 400, so a new Gemini model belongs here when it ships. OpenAI's
# reasoning models are not listed: core/client.py drops the parameters on
# OPENAI whenever a reasoning effort other than "none" is sent, which is
# OpenAI's own rule and needs no model names.
#
# On ANTHROPIC every model drops them since batch 234 (API version
# 2026-10-21 refuses them on all of them), so the claude names below matter
# for Claude reached through an OpenAI-compatible gateway, by its bare name.
models_rejecting_sampling_params:
  - claude-fable-5
  - claude-fable-5-1
  - claude-haiku-5-5
  - claude-mythos-5
  - claude-mythos-5-1
  - claude-opus-4-7
  - claude-opus-4-8
  - claude-opus-5
  - claude-opus-5-5
  - claude-sonnet-5
  - claude-sonnet-5-5
  - gemini-3.5-flash-lite
  - gemini-3.6-flash

# ======================================================================
# Critic and embedder routing
# ======================================================================

# AUTHORITY -- names a provider every claim is sent to. `/critic` writes a
# user-tier store that OUTRANKS this, and settings.json rejects the key by
# name at every tier. null means no special routing.
critic_model: null

# AUTHORITY -- names a provider that receives claim text and the text of every
# page a run fetched. `/embedder` outranks this. null means no special
# routing.
embedder_model: null

# Per-embedder similarity floor and ceiling, matched by model-name PREFIX
# (the longest matching prefix wins).
similarity_calibration:
  text-embedding-3:
    floor: 0.1
    ceiling: 0.65
  text-embedding-ada:
    floor: 0.7
    ceiling: 0.92
  e5-:
    floor: 0.7
    ceiling: 0.92
  multilingual-e5:
    floor: 0.7
    ceiling: 0.92
  bge-:
    floor: 0.55
    ceiling: 0.85
  gte-:
    floor: 0.55
    ceiling: 0.88
  nomic-embed:
    floor: 0.4
    ceiling: 0.8
  embed-english:
    floor: 0.25
    ceiling: 0.8
  voyage:
    floor: 0.35
    ceiling: 0.85
  gemini-embedding:
    floor: 0.35
    ceiling: 0.85

# For an embedder that matches no prefix above.
default_similarity_calibration:
  floor: 0.25
  ceiling: 0.85

# The query/passage prefixes asymmetric embedders need, matched by
# model-name prefix. An embedder absent from here is sent bare text.
embedder_prefixes:
  e5-:
    query: 'query: '
    passage: 'passage: '
  multilingual-e5:
    query: 'query: '
    passage: 'passage: '
  bge-:
    query: 'Represent this sentence for searching relevant passages: '
    passage: ''
  gte-:
    query: ''
    passage: ''
  nomic-embed:
    query: 'search_query: '
    passage: 'search_document: '
  gemini-embedding:
    query_task_type: RETRIEVAL_QUERY
    passage_task_type: RETRIEVAL_DOCUMENT
  text-embedding-004:
    query_task_type: RETRIEVAL_QUERY
    passage_task_type: RETRIEVAL_DOCUMENT

# ======================================================================
# Source authority: domain classes
# ======================================================================

# Class name -> authority score. The second table, below, maps hosts onto
# these names, so a score is changed in one place.
domain_authority_classes:
  restricted_registry: 0.9 # .gov .mil .int .edu, gov.uk, ac.uk...
  intergovernmental: 0.9 # WHO, UN, World Bank, OECD, EU
  standards_body: 0.88 # IETF, W3C, ISO, NIST, IEC
  peer_reviewed_publisher: 0.85
  established_news: 0.65
  preprint_server: 0.6 # not peer reviewed; §45 SQ5 refines this
  reference_tertiary: 0.55 # encyclopaedias -- a pointer to a source
  generic_org: 0.55 # an unrestricted registry, small bump
  generic_commercial: 0.45
  blog_platform: 0.3
  forum_qa: 0.25
  social_media: 0.15
  content_farm: 0.1

# The score for a host that matches no suffix below; its class reads
# "unknown".
default_domain_authority: 0.45

# Host suffix -> a class name from the table above. The `<kind>.<cc>`
# second-level forms are derived in source_scoring.py, not listed here.
domain_authority_suffixes:

  # Restricted registries. The bare TLDs; the `<kind>.<cc>`
  # second-level forms are derived in source_scoring.py rather than
  # listed.
  gov: restricted_registry
  mil: restricted_registry
  int: restricted_registry
  edu: restricted_registry

  # Intergovernmental bodies, whose hosts are ordinary .org/.int
  # names.
  who.int: intergovernmental
  un.org: intergovernmental
  europa.eu: intergovernmental
  oecd.org: intergovernmental
  imf.org: intergovernmental
  worldbank.org: intergovernmental
  iaea.org: intergovernmental

  # Standards bodies.
  ietf.org: standards_body
  rfc-editor.org: standards_body
  w3.org: standards_body
  iso.org: standards_body
  iec.ch: standards_body
  ieee.org: standards_body
  unicode.org: standards_body
  ecma-international.org: standards_body

  # Peer-reviewed publishers and indexes.
  nature.com: peer_reviewed_publisher
  science.org: peer_reviewed_publisher
  sciencemag.org: peer_reviewed_publisher
  nejm.org: peer_reviewed_publisher
  thelancet.com: peer_reviewed_publisher
  bmj.com: peer_reviewed_publisher
  cell.com: peer_reviewed_publisher
  pnas.org: peer_reviewed_publisher
  sciencedirect.com: peer_reviewed_publisher
  springer.com: peer_reviewed_publisher
  link.springer.com: peer_reviewed_publisher
  onlinelibrary.wiley.com: peer_reviewed_publisher
  wiley.com: peer_reviewed_publisher
  tandfonline.com: peer_reviewed_publisher
  sagepub.com: peer_reviewed_publisher
  acm.org: peer_reviewed_publisher
  aps.org: peer_reviewed_publisher
  acs.org: peer_reviewed_publisher
  plos.org: peer_reviewed_publisher
  frontiersin.org: peer_reviewed_publisher
  mdpi.com: peer_reviewed_publisher
  jstor.org: peer_reviewed_publisher
  pubmed.ncbi.nlm.nih.gov: peer_reviewed_publisher

  # Preprint servers and repositories -- not peer reviewed.
  arxiv.org: preprint_server
  biorxiv.org: preprint_server
  medrxiv.org: preprint_server
  chemrxiv.org: preprint_server
  ssrn.com: preprint_server
  papers.ssrn.com: preprint_server
  osf.io: preprint_server
  researchsquare.com: preprint_server
  semanticscholar.org: preprint_server

  # News organisations with a correction policy and a masthead.
  # An ALLOWLIST, because "news site" is not a property of a
  # domain suffix and the alternative is scoring every .com that
  # publishes articles.
  reuters.com: established_news
  apnews.com: established_news
  bbc.com: established_news
  bbc.co.uk: established_news
  ft.com: established_news
  economist.com: established_news
  nytimes.com: established_news
  washingtonpost.com: established_news
  wsj.com: established_news
  theguardian.com: established_news
  npr.org: established_news
  pbs.org: established_news
  bloomberg.com: established_news
  nikkei.com: established_news
  afp.com: established_news
  dw.com: established_news

  # Tertiary references -- they summarise sources rather than
  # being one.
  wikipedia.org: reference_tertiary
  wikimedia.org: reference_tertiary
  wiktionary.org: reference_tertiary
  britannica.com: reference_tertiary
  org: generic_org

  # Blog and newsletter platforms: the host says nothing about
  # the author.
  medium.com: blog_platform
  substack.com: blog_platform
  wordpress.com: blog_platform
  blogspot.com: blog_platform
  blogger.com: blog_platform
  tumblr.com: blog_platform
  wixsite.com: blog_platform
  ghost.io: blog_platform
  reddit.com: forum_qa
  quora.com: forum_qa

  # Forums and Q&A. Often correct, never attributable.
  stackexchange.com: forum_qa
  stackoverflow.com: forum_qa
  news.ycombinator.com: forum_qa
  4chan.org: content_farm

  # Social media. Speculation and unattributed claims travel here
  # fastest, which is the whole reason a claim needs grounding
  # elsewhere.
  x.com: social_media
  twitter.com: social_media
  facebook.com: social_media
  instagram.com: social_media
  tiktok.com: social_media
  threads.net: social_media
  linkedin.com: social_media
  mastodon.social: social_media
  bsky.app: social_media
  youtube.com: social_media
  vk.com: social_media
  weibo.com: social_media
  t.me: social_media

  # Aggregators that republish without attribution, and image
  # boards with no text to ground anything in. The measured
  # case: a Pinterest pin scored similarity 1.0 on a Nobel
  # Prize claim.
  pinterest.com: content_farm
  answers.com: content_farm
  ehow.com: content_farm
  scribd.com: content_farm
  coursehero.com: content_farm
  chegg.com: content_farm

# How far a stated reason may move a source's authority score, in either
# direction.
authority_adjustment_cap: 0.15

# ======================================================================
# The sources/ artifact
# ======================================================================

# Whether the sources/ artifact keeps the fetched page text alongside the
# scores, or the scores alone.
persist_source_text: true

# ======================================================================
# Scholarly authority (OpenAlex)
# ======================================================================

# Whether the OpenAlex lookup runs at all. Off ships no outbound
# scholarly requests.
scholar_lookup: false

# The OpenAlex base URL.
scholar_api_url: https://api.openalex.org

# Per-request timeout, in seconds.
scholar_timeout_s: 8.0

# Retries per request; total attempts is this plus one.
scholar_max_retries: 2

# How long a lookup is cached in-process, in seconds.
scholar_cache_ttl_s: 900

# Sent as OpenAlex's `mailto` parameter when non-empty, which is their
# polite-pool convention. Blank sends no address and is the shipped value:
# an address here leaves the machine on every lookup.
scholar_mailto: ''

# The three weights below split one score and a settings.json
# `source_scoring` block can override each. They are expected to sum to 1.
scholar_venue_weight: 0.4
scholar_citation_weight: 0.4
scholar_author_weight: 0.2

# OpenAlex location type -> venue credit. `unknown` is the fallback for an
# unrecognised type, and a work with no location at all takes
# `repository`.
scholar_venue_credit:
  journal: 1.0
  conference: 1.0
  book series: 0.85
  repository: 0.55 # arXiv, bioRxiv, institutional repositories
  unknown: 0.6

# The h-index at which author credit saturates.
scholar_h_saturation: 60

# Below this many works in a field-year cohort, the citation percentile is
# not trusted.
scholar_min_cohort_size: 200

# A work younger than this has not had time to accrue citations, so the
# citation term is not held against it.
scholar_min_citation_age_days: 60

# The authority a retracted work is given outright, whatever else it
# scores.
scholar_retracted_authority: 0.05

# ======================================================================
# Reasoning effort
# ======================================================================

# Reasoning effort when nothing more specific speaks: --effort >
# settings.json `effort` > this, with settings.json `tui.effort` winning
# inside the TUI. null sends no effort at all.
default_effort: high

# Known effort levels per model, for providers whose API exposes no
# capability query. An EMPTY list means the model accepts none, which is
# different from being absent -- absent falls through to the list below.
model_effort_levels:
  gpt-4o: []
  gpt-4o-mini: []
  gpt-4.1: []
  gpt-4.1-mini: []
  gpt-4.1-nano: []
  gpt-3.5-turbo: []

# Used for a model with no entry above.
default_effort_levels:
  - low
  - medium
  - high
  - xhigh
  - max
  - ultra

# Effort level -> Google thinking_budget in tokens. -1 hands the choice to
# the model.
google_thinking_budgets:
  low: 2048
  medium: 8192
  high: 16384
  xhigh: 24576
  ultra: 32768
  max: -1

# ======================================================================
# Database
# ======================================================================

# The SQLite file behind the conversation database. APP_DB_PATH overrides;
# the npm launcher points it at ~/.config/venastine so state is global
# while artifacts stay local.
db_path: app.db

# ======================================================================
# File-ops workspace
# ======================================================================

# The file tools' read-write root, and a PERMISSION BOUNDARY: file_ops
# auto-approves writes inside it. AGENT_WORKSPACE overrides, and naming it
# also makes the resolved workspace the project path -- so pointing it at a
# home directory would auto-approve writes there for every project. Writing
# the path HERE moves the workspace alone; the key below moves the project
# with it.
workspace_dir: ./workspace

# Whether that workspace is also the PROJECT: what workspace trust asks about,
# which .venastine/ supplies settings and agents, where /init scaffolds, and
# what project-scoped memories belong to. Naming AGENT_WORKSPACE has always
# done this; the key is the same statement made in the file, for the reader
# who has no variable to set. Either route suffices, and neither is needed to
# work inside a project you launched from -- that is already the project.
workspace_is_project: false

# Hard reject before opening, in both directions (25 MB).
max_file_size_bytes: 25000000

# Per-read line ceiling. A larger `count` is clamped, with a note in the
# result rather than silently.
max_read_lines: 500

# Per-read character ceiling, the truncation point for sandboxed stdout and
# stderr, and the bound on an MCP tool's whole result.
max_read_chars: 50000

# ROADMAP_v3 §81 (IM7). The largest image `view_image` attaches, in bytes of
# the file (3.75 MiB). Base64 inflates it by 4/3, so the encoded payload stays
# under 5 MiB -- the smallest per-image limit of the wires that carry it --
# and the image is resent with every request for as long as it stays in view.
max_image_bytes: 3932160

# ======================================================================
# /init
# ======================================================================

# The agent /init runs.
initializer_agent: initializer

# Most characters read_project_doc returns per file.
init_read_chars: 20000

# Step ceiling for the /init run when its agent names none.
init_max_steps: 12

# Largest existing AGENTS.md /init will revise, in characters. Above it
# /init stops before any model call: the reply replaces the whole file.
init_max_hub_chars: 1000000

# Most lines of the proposed diff /init prints before asking.
init_diff_shown_lines: 2000

# ======================================================================
# MCP teardown
# ======================================================================

# Seconds allowed for MCP session teardown at shutdown before the harness
# stops waiting.
teardown_budget_s: 10.0

# ======================================================================
# MCP results
# ======================================================================

# Largest single server-sent event, in bytes, a Streamable HTTP ("http")
# MCP server may stream back. A bigger one fails that tool call with an
# error naming the limit; the session survives. An answer sent as plain
# JSON is not an event and is not bounded by this. Legacy "sse" servers
# keep the MCP SDK's own 1 MiB, which it gives no way to change. 16 MiB.
# What reaches the model is bounded separately, by max_read_chars.
mcp_max_event_bytes: 16777216

# ======================================================================
# Network limits
# ======================================================================

# A ceiling on what the harness pulls and pushes over any rolling window,
# for a metered connection. Every ceiling ships at 0, which means no limit,
# no counting and no file. Each one is in decimal megabytes (1 MB =
# 1,000,000 bytes, the way carriers count) and covers both directions.
#
# Three meters, enabled separately, because they are not the same kind of
# traffic: a local Ollama or a local MCP server costs no allowance.
#   tools     fetch_url, arxiv_search, web_search and the scholar lookup.
#   provider  every model call: chat, the research passes, the embedder.
#             The upload is the big part, since every step re-sends the
#             thread.
#   mcp       MCP servers reached over "http" or "sse".
#
# A call is checked before it starts. One that would pass its ceiling is
# refused with a reason, and one already running is never cut off, so a
# meter can end up over by one response. Counts are kept in
# ~/.config/venastine/network.db, shared by every harness process, and
# written at most once a minute. Entries older than the window are deleted.
#
# What these CANNOT count: shell commands (containers, WSL, SSH), "stdio"
# MCP servers, sign-in and token-refresh traffic, and TLS/TCP overhead.
# web_search's figure is an estimate, measured at about 21 kB per result
# asked for, because its client has no way to count. /network shows every
# meter, what it has used, and when room returns.
network_window_hours: 24
network_limit_tools_mb: 0
network_limit_provider_mb: 0
network_limit_mcp_mb: 0

# ======================================================================
# Reading web pages and PDFs
# ======================================================================

# How much fetch_url downloads of one HTML page or one PDF, in decimal
# megabytes. What the model reads is the extracted TEXT -- a page without
# its navigation, a PDF's words -- held up to 200,000 characters at a time
# and paged through; an offset past that fetches again and serves the rest.
#
# An HTML page past its limit is read as far as the limit and says the rest
# was never retrieved. A PDF cannot be read in part (its index is at the
# end), so one past its limit is refused whole, before it is downloaded
# when the server states its size. PDFs are parsed with pypdf in a separate
# process that tool_compute_timeout_s stops. Text that is neither (JSON,
# plain text, XML) keeps its 64 KB read limit.
fetch_max_html_mb: 2
fetch_max_pdf_mb: 32

# ======================================================================
# Shell and sandbox
# ======================================================================

# The shell the sandbox runs commands through. EMPTY means auto-detect,
# which is the shipped value. AGENT_SHELL overrides.
shell_binary: ''

# AUTHORITY -- part of the frozen security posture. Enables the weak
# host-subprocess backend, which is unbounded code on the host. Bound once
# at first read and frozen, so no tool call, settings file, environment
# variable or slash command can move it.
allow_insecure_sandbox_fallback: false

# AUTHORITY -- runs that fallback with no per-run prompt. The pair above and
# here reads as worse than either alone. Honoured under `tiered` and
# `contained`; under `always` every command still asks, this one included.
auto_approve_sandbox_fallback: false

# AUTHORITY -- part of the frozen security posture. Lets the agent ask
# for a command to run in WSL (ROADMAP_v3 §49, slice 3). It is NOT a
# weaker container: a command there reaches this harness's own
# config.yaml and ~/.config, gets no memory, CPU or process limit, and
# can start Windows programs with your full authority -- Windows
# interop is a kernel feature there and survives an emptied
# environment. Only a read-only command whose every argument is inside
# the workspace runs there without asking; everything else meets a
# prompt under `tiered` and `contained` alike. Shown on the startup
# banner and the TUI badge whenever it is on.
allow_wsl_backend: false

# Which WSL distribution the backend runs in. EMPTY means the first one
# `wsl.exe -l -q` lists, which is WSL's own default. A name that is not
# installed is refused with the installed names, rather than passed to
# `wsl.exe` -- which answers an unknown distro by exiting 4294967295
# and writing its complaint to stdout in UTF-16, so the failure would
# read as the command's rather than the configuration's.
wsl_distro: ''

# AUTHORITY -- part of the frozen security posture. Lets the agent ask
# for a command to run on the remote host configured below (ROADMAP_v3
# §49, slice 4). A remote host is not a sandbox and not a weaker one: it
# is a machine this harness cannot look at. It gets no memory, CPU or
# process limit -- those belong to the remote -- and the credentials it
# uses are ones you issued, not ones this harness controls.
# NOTHING runs there without asking you first, not even a read-only
# command: "inside the workspace" is a question about a filesystem this
# process cannot resolve, so it is not asked. Shown on the startup
# banner and the TUI badge whenever it is on.
allow_ssh_backend: false

# The one remote host the SSH backend reaches. The agent asks for
# `backend: "ssh"` and gets THIS host; it never names a host itself,
# for the reason `wsl_distro` is not the agent's either -- which machine
# this harness may reach is your question, and which command needs it is
# the agent's.
ssh_host: ''
ssh_user: ''
ssh_port: 22

# The private key to authenticate with. EMPTY offers whatever a running
# ssh-agent holds. This harness NEVER asks for, holds or stores a
# passphrase: if the key is encrypted, load it into an agent with
# `ssh-add` first. Measured, and the reason the backend passes
# BatchMode=yes: without it, an encrypted key with no agent makes ssh
# wait forever for a passphrase on a terminal this process does not own.
ssh_identity_file: ''

# Where a command runs on the remote. REQUIRED when the backend is on,
# and deliberately not defaulted to the login home: a command that runs
# somewhere nobody named is the failure this backend is most able to
# cause, and nothing here can see where it landed.
ssh_remote_workspace: ''

# The remote's host key, PINNED. Run `ssh-keyscan -p <port> <host>` and
# paste its output here (the `#` banner line is ignored). A host whose
# key does not match this is refused -- not prompted about, because a
# prompt on first use is a question a headless run has nobody to ask,
# and because a key that CHANGES is exactly the case worth refusing.
ssh_host_key: ''

# Which `ssh` program to run. EMPTY prefers the operating system's own
# (%SYSTEMROOT%\System32\OpenSSH\ssh.exe on Windows) and falls back to
# PATH. Not PATH first: on the machine this was built, PATH resolves to
# a git-for-Windows build while the OS ships its own, and the two report
# different text for the same failure.
ssh_binary: ''

# AUTHORITY -- THE gate for shell approval, and part of the frozen posture.
#   always    -- every command asks
#   tiered    -- read-only commands from inert_commands, every argument
#                inside the workspace, run unprompted; every other command
#                asks, including anything that can run code
#   classified -- tiered, plus a decision model (the shell_classifier_*
#                keys below) asked about a single command that runs in the
#                container and that tiered would ask about. If it passes
#                your thresholds, the command runs unprompted. Compound
#                commands (any of ; | & $ ` > < ( ) { } ! # ~ ' " \),
#                reads outside the workspace, the host fallback, WSL and
#                SSH are never sent to it and ask exactly as under tiered
#   contained -- anything that runs in the container without network runs
#                unprompted, code included; reads outside the workspace and
#                network commands still ask
#   never     -- nothing asks
# An unknown value raises at startup rather than falling back, because one
# direction of a fallback asks about everything and the other about
# nothing, and a typo cannot pick. Rejected by name from settings.json at
# every tier: a cloned repo could otherwise set `never`.
# Shell approval is governed solely here: `tool_approvals` deliberately has
# no `shell` key, so there is no second switch that can disagree with this.
shell_approval_mode: tiered

# AUTHORITY -- the decision model `classified` asks (ROADMAP_v3 §56). Only
# read when shell_approval_mode is `classified`; `/classifier test <command>`
# shows a verdict under any mode without running anything.
#
# READ THIS BEFORE TURNING IT ON. This is the one setting in the harness
# that WIDENS what runs without asking you, by design. The model reads the
# command and the project path and nothing else -- never the agent's stated
# reason -- but the command itself is text the agent wrote, and the agent
# may have read something written to steer it. A decision model's
# guarantee is that its answer has the right TYPE (a number in range), not
# that its judgement is right; TypeSafe's own documentation says content
# written to steer Jev "can move the answer". A confident wrong number is
# exactly what a threshold acts on. Start with shell_classifier_on_fail:
# ask, and watch its verdicts in the approval prompt before trusting it.
#
# A small local model and a hosted one are two different policies wearing
# the same thresholds. And a model ALIAS moves when its vendor ships a new
# release (TypeSafe: jev-latest), so name a version (jev-1.14.0) once you
# have tuned the numbers against it.
#
# Which wire to speak: `systemone` (TypeSafe's Jev at
# https://api.typesafe.ai/v1, or Ollama 0.35+ at http://localhost:11434/v1
# with a decision model such as nimble), or `openai_json` (any
# OpenAI-compatible provider, asked for a strict JSON answer; its numbers
# are coarser, and not calibrated probabilities).
shell_classifier_style: systemone

# AUTHORITY -- the classifier's base URL, ending at /v1. Empty means not
# configured: every command the model would have answered asks, exactly as
# under tiered.
shell_classifier_url: ''

# AUTHORITY -- the model to ask, e.g. jev-1.14.0 or nimble.
shell_classifier_model: ''

# AUTHORITY -- the providers.json ENTRY whose API_KEY is sent to the URL
# above, e.g. TYPESAFE or OPENAI. Empty sends no key (a local Ollama needs
# none). The key itself never goes in this file, and it is never sent
# over plain http to another machine.
shell_classifier_credential: ''

# AUTHORITY -- seconds to wait for a verdict. No verdict in time means the
# command asks; it never means it runs.
shell_classifier_timeout_s: 10

# AUTHORITY -- what a command outside any threshold does: `ask` raises the
# normal approval prompt, with the verdict shown in it; `reject` refuses
# the command without asking. A model that gives no verdict always asks.
shell_classifier_on_fail: ask

# AUTHORITY -- the four thresholds, each from 0 to 1. A command runs
# unprompted only if all four pass. This one, containedness: how
# completely its effects stay inside the project. Passes at or ABOVE it.
shell_classifier_min_containedness: 0.75

# AUTHORITY -- general risk: how much harm the command could do. Passes at
# or below it.
shell_classifier_max_risk: 0.25

# AUTHORITY -- workspace modification: how much it changes the project's
# files. Passes at or below it.
shell_classifier_max_modification: 0.5

# AUTHORITY -- networkedness: the probability it uses the network. Passes
# at or below it.
shell_classifier_max_network: 0.5

# The image sandboxed commands run in, under Docker or Podman (whichever
# runs the sandbox -- ROADMAP_v3 §49, SS22). Fully qualified so Podman
# resolves it without a short-name alias (SS23). AGENT_SANDBOX_IMAGE
# overrides.
sandbox_docker_image: docker.io/library/python:3.13-slim

# Wall-clock ceiling for one sandboxed command.
sandbox_timeout_seconds: 120

# Memory ceiling for the sandbox, in MB.
sandbox_memory_mb: 2048

# CPU-time ceiling for the sandbox, in seconds.
sandbox_cpu_seconds: 30

# Process ceiling for the sandbox.
sandbox_max_pids: 200

# Background and monitor shell sessions (ROADMAP_v3 §49, SS12-SS13).
#
# The longest a session may run. An agent asking for more is started with
# this and told so -- never refused.
shell_session_timeout_cap_s: 3600

# How long an INTERACTIVE shell may sit with nothing typed into it
# before it is closed (ROADMAP_v3 §49, SS25). Unlike a background
# command, an interactive session does not block your prompt, so this is
# the only thing that stops a forgotten shell holding a container open
# until its timeout cap. Measured from the last input, not the last
# output: a program printing to itself is still one nobody is using.
shell_session_idle_timeout_s: 600

# How many sessions of any kind may be live at once, counted across the
# main agent and every subagent. Each is its own container under the
# memory ceiling above. An interactive shell counts here -- it holds a
# container like any other -- even though it does not block your prompt.
shell_session_max_live: 4

# How many times in a row finished sessions may wake the agent with no
# message from you. Past it, waking stops, the prompt unblocks, and the
# results wait for your next message.
shell_session_max_consecutive_wakes: 10

# How much of a session's output is kept, in memory only and never on
# disk: its first characters and its most recent ones. The middle is
# dropped, and the agent is told where.
shell_session_output_head_chars: 10000
shell_session_output_tail_chars: 190000

# ======================================================================
# Output redaction and tool isolation
# ======================================================================

# AUTHORITY -- the master switch for pattern-based redaction of everything
# leaving a tool, and part of the frozen posture. There is deliberately no
# settings.json key. VENASTINE_REDACT_OFF can only ever turn redaction
# OFF for a run, never on, and is bound at the same moment as this.
redact_tool_outputs: true

# Wall clock for one BUDGET_COMPUTE tool call, and the CPU ceiling handed
# to the isolated child process that runs it.
tool_compute_timeout_s: 20

# First words that make a sandboxed command need the network. Anything not
# listed runs with networking off.
network_allowed_commands:
  - pip
  - pip3
  - curl
  - wget
  - git
  - npm
  - yarn
  - pnpm
  - apt
  - apt-get
  - yum
  - dnf
  - brew
  - cargo

# Read-only inspection commands eligible for the auto-approved inert tier
# under `shell_approval_mode: tiered`. Sound as a bare token list only
# because that tier executes argv with no shell, so the tokens ARE the
# arguments.
#
# WHAT BELONGS HERE, after batch 117 found two things that did not. A
# command qualifies only if it cannot write, and "cannot write" has to hold
# for its ARGUMENTS as well as its name:
#
#   * A writing FLAG is guarded by `_DANGEROUS_FLAGS` in security/sandbox.py
#     -- `tree -o FILE` and `date -s TIME` were inert with no entry there
#     until batch 117, so the tier reported `writes=False` about a write.
#   * A writing POSITIONAL cannot be guarded at all. `uniq IN OUT` writes to
#     its second argument with no flag to catch, so `uniq` was REMOVED from
#     this list rather than given an entry that could not work. Teaching the
#     classifier which positions are outputs would make it a shell parser,
#     which security/sandbox.py's own G2 argument forbids.
#
# The bound that still held throughout: `_escapes_workspace` reads every
# token after the first as a path, so a write aimed outside the workspace
# was refused regardless. What was wrong was the profile's claim, not the
# containment.
inert_commands:
  - ls
  - cat
  - pwd
  - echo
  - grep
  - wc
  - head
  - tail
  - date
  - whoami
  - uname
  - which
  - where
  - type
  - file
  - stat
  - du
  - df
  - tree
  - diff
  - md5sum
  - sha256sum

# ======================================================================
# Research grants and review
# ======================================================================

# Ceiling on granted tool calls in one run, across every grant.
max_granted_tool_calls: 150

# How long an attended approval waits for an answer before giving up on
# it.
attended_approval_timeout_s: 600

# Whether a finished research run is reviewed. A settings.json
# `research.subagent_review` outranks this; --no-review escapes it for one
# run.
subagent_review: false

# Findings kept from one review; the rest are dropped with a warning.
max_review_findings: 25

# Rounds a single finding may be refined before it is recorded as
# rejected.
max_review_refinements: 3

# ======================================================================
# Compaction
# ======================================================================

# How much of the model's context window a thread may fill before
# compaction folds it. What the fraction really names is the HEADROOM --
# the remainder, which the step after the trigger fires has to fit inside,
# because nothing in the harness recovers from a prompt that overflows the
# window. A bare share gets that wrong at both ends of the roster: 0.10 of
# 1M is 100k and 0.10 of 64k is 6.4k, while ONE capped tool read is 12,500
# proxy tokens. Hence the two clamps below.
compaction_trigger_fraction: 0.90

# The headroom never shrinks below this, however small the window. Sized
# from max_read_chars (50,000 chars = 12,500 proxy tokens, the largest a
# single bounded read can return) plus the assistant turn that asked for
# it. Binds under a ~160k window and nowhere above one, so a 262k or 1M
# thread gets exactly the fraction above and a 64k thread keeps a usable
# margin instead of 6.4k.
compaction_min_headroom_tokens: 16000

# ...and never grows past this share of the window, which is what stops
# the floor above from eating a small window whole -- 16k of a 32k window
# is half of it. This is the clamp that keeps the trigger positive and
# above keep_recent_tokens at the bottom of the range.
compaction_max_headroom_fraction: 0.25

# The trigger used when NO MODEL IS IN SCOPE. A settings.json
# `compaction.trigger_tokens` overrides it.
compaction_trigger_tokens: 40000

# The early warning fires this many tokens BEFORE the trigger. Must stay
# strictly below the trigger, or the warning arrives after the thing it
# warns about; the loader refuses a pair that cannot work.
compaction_warning_margin_tokens: 8000

# Recent conversation held out of a fold verbatim.
compaction_keep_recent_tokens: 4000

# Recent turns held out of a fold verbatim, whichever bound binds first.
compaction_keep_recent_turns: 3

# The share of the trigger that pinned content may occupy, so a pin cannot
# force permanent compaction.
pin_max_trigger_fraction: 0.5

# Default fold strength: one of the keys of `compaction_target_ratios`.
compaction_strength: 3

# Attempts at one fold before it is abandoned.
compaction_max_retries: 2

# Strength -> the fraction of the original character count a fold aims
# for. INTEGER keys, and they are the closed set a settings.json
# `compaction.strength` is checked against.
compaction_target_ratios:
  1: 0.4
  2: 0.25
  3: 0.15
  4: 0.1
  5: 0.05

# How far over target a fold may land before it is retried.
compaction_ratio_tolerance: 0.5

# Default strategy.
#   chain    -- fold the previous summary together with the new span
#   rederive -- re-summarise the whole thread from the archive
compaction_strategy: chain

# The closed vocabulary `compaction_strategy` and any settings.json
# `compaction.strategy` are checked against.
compaction_strategies:
  - rederive
  - chain

# Memories injected into a prompt at once. 0 disables the `remember` tool
# rather than injecting nothing.
max_injected_memories: 50

# ======================================================================
# Catalog text
# ======================================================================

# Cap on a skill's or agent's `name` and `description` -- the two strings
# that reach every run's system prompt from a .md file with no tool call
# and no further consent. The newline collapse that comes with it matters
# more than the number.
max_catalog_text_chars: 300

# ======================================================================
# Summaries, references and the checklist
# ======================================================================

# The agent that does the summarising, for both folds and /summary.
compactor_agent: compactor

# How long a whole-thread summary may be, in characters. ABSOLUTE rather
# than a ratio: this summary is injected into every turn of a REFERENCING
# thread, where nothing it replaces bounds it.
summary_target_chars: 2000

# Referenced threads attachable to one thread at once. REFUSES rather than
# dropping the oldest, because a reference is something a person named.
max_injected_refs: 3

# The checklist vocabulary, and the enum in todo_write's own schema. A
# plain list rather than an enum so a list stored under an older
# vocabulary reads back as data instead of raising.
todo_statuses:
  - pending
  - in_progress
  - completed

# Checklist ceiling. REFUSES rather than truncating: a list silently cut
# would leave the model believing it had recorded work it has forgotten.
max_todo_items: 50

# Research passes compact only this far from the model's actual context
# window -- a safety net against a hard provider error mid-pipeline, not a
# working-set policy.
compaction_pipeline_backstop_tokens: 20000

# ======================================================================
# Context windows
# ======================================================================

# Model -> input window, in tokens. A FALLBACK now, not the only source:
# core/client.py queries the provider where the SDK exposes it, and
# core/model_windows.py holds the user's own `/window` answer, which
# outranks both. A miss here warns once per model.
model_context_windows:
  claude-opus-5: 1000000
  claude-sonnet-5: 1000000
  claude-fable-5: 1000000
  claude-opus-4-8: 1000000
  claude-opus-4-7: 1000000
  claude-opus-4-6: 1000000
  claude-sonnet-4-6: 1000000
  claude-haiku-4-5: 200000
  gpt-5.1: 400000
  gemini-2.5-pro: 1000000
  qwen3.8-max-preview: 983616

# For a model absent from the table above and unqueryable. Logged at
# WARNING once per model, because a wrong window now decides when every
# thread folds.
default_context_window: 256000

# ======================================================================
# Connecting a model
# ======================================================================

# The Hugging Face OAuth app /connect huggingface signs in through, by its
# client id -- a PUBLIC value, not a secret. This one is the project's own
# app, registered without a secret, with the device code flow and the scopes
# `openid profile inference-api` (ROADMAP_v3 §79, HD5). Another app's id
# signs in through that app instead; empty hides the sign-in and leaves a
# pasted token working.
hf_oauth_client_id: "3a823316-767d-4abe-8e55-6c0354ce2c27"

# ======================================================================
# Tool permissions and approvals
# ======================================================================

# AUTHORITY -- whether each registered tool may be called AT ALL.
# is_tool_allowed() reads this before any context or approval logic and a
# tool context can never widen it, so a false here cannot be re-enabled at
# runtime by an agent, a skill or a settings file -- only by editing this
# file. read / view_image / write / edit / shell ship false for that reason,
# and so do the five background-session tools after shell: a session is a
# shell command that keeps running, and enabling one without the others is
# allowed but rarely useful. view_image follows read because it reads a file
# off disk the same way; it also needs a provider marked `accepts_images` in
# providers.json before it is offered at all (ROADMAP_v3 §81, IM6).
# Every registered tool must appear in BOTH tables or the harness refuses
# to start (D24).
tool_permissions:
  web_search: true
  fetch_url: true
  get_time: true
  arxiv_search: true
  symbolic_math: true
  linear_algebra: true
  probability_stats: true
  discrete_math: true
  logic: true
  geometry: true
  read: false
  view_image: false
  write: false
  edit: false
  shell: false
  shell_background: false
  shell_monitor: false
  shell_interactive: false
  shell_input: false
  shell_sessions: false
  shell_output: false
  shell_kill: false
  load_skill: true
  spawn_subagent: true
  pin: true
  unpin: true
  remember: true
  read_project_doc: true
  write_project_doc: true
  ask_user: true
  todo_write: true

# AUTHORITY -- whether each tool needs a human yes before it runs. Approval ORs
# across every layer, so a true here is a one-way ratchet that can only
# add prompts. `shell`, `shell_background`, `shell_monitor` and
# `shell_interactive` are deliberately absent: their approval is governed
# solely by `shell_approval_mode` above -- there is no second switch, so
# there is nothing here that can disagree with it. Listing, reading and
# stopping a session ask nothing: they act only on this conversation's own
# sessions. `shell_input` is here and ships false because approving the
# shell approved what you type into it (SS29) -- set it true to be asked
# about every line instead.
# A tool gated here is not merely denied where nothing can ask -- it stops
# being advertised at all, which is why ask_user, pin and todo_write are
# ungated.
tool_approvals:
  web_search: false
  fetch_url: false
  get_time: false
  arxiv_search: false
  symbolic_math: false
  linear_algebra: false
  probability_stats: false
  discrete_math: false
  logic: false
  geometry: false
  read: false
  view_image: false
  write: false
  edit: false
  shell_input: false
  shell_sessions: false
  shell_output: false
  shell_kill: false
  load_skill: false
  spawn_subagent: true
  pin: false
  unpin: false
  remember: true
  read_project_doc: false
  write_project_doc: true
  ask_user: false
  todo_write: false
